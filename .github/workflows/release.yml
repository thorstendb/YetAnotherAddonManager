name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Set version from tag or input
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            echo "::error::No version provided and no tag found"
            exit 1
          fi
          echo "Building version: $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
        shell: bash

      - name: Build distribution (${{ matrix.platform }})
        run: yarn dist${{ matrix.platform == 'mac' && ':mac' || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}

      - name: Upload setup artifact
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v5
        with:
          name: release-win-setup
          path: release/*-setup.exe
          if-no-files-found: ignore

      - name: Upload portable artifact
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v5
        with:
          name: release-win-portable
          path: release/*-portable.exe
          if-no-files-found: ignore

      - name: Upload macOS artifacts
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v5
        with:
          name: release-mac
          path: |
            release/*.zip
            release/*.dmg
          if-no-files-found: ignore

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          fi
          echo "tag=v${V}" >> "$GITHUB_OUTPUT"
          echo "name=v${V}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/*-setup.exe
            artifacts/*-portable.exe
            artifacts/*.zip
            artifacts/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
